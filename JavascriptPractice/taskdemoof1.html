<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Loop Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        .loop-box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .output {
            background: #eef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <h1>JavaScript Loop Visualization</h1>

    <div class="loop-box">
        <h2>For Loop</h2>
        <button onclick="runForLoop()">Run For Loop</button>
        <div class="output" id="forOutput"></div>
    </div>

    <div class="loop-box">
        <h2>While Loop</h2>
        <button onclick="runWhileLoop()">Run While Loop</button>
        <div class="output" id="whileOutput"></div>
    </div>

    <div class="loop-box">
        <h2>Do...While Loop</h2>
        <button onclick="runDoWhileLoop()">Run Do...While Loop</button>
        <div class="output" id="doWhileOutput"></div>
    </div>

    <div class="loop-box">
        <h2>forEach Loop</h2>
        <button onclick="runForEachLoop()">Run forEach Loop</button>
        <div class="output" id="forEachOutput"></div>
    </div>

    <script>
        function runForLoop() {
            let output = "";
            for (let i = 1; i <= 5; i++) {
                console.log("For Loop Iteration: " + i);
                output += "Iteration " + i + "<br>";
            }
            document.getElementById("forOutput").innerHTML = output;
        }

        function runWhileLoop() {
            let output = "";
            let i = 1;
            while (i <= 5) {
                console.log("While Loop Iteration: " + i);
                output += "Iteration " + i + "<br>";
                i++;
            }
            document.getElementById("whileOutput").innerHTML = output;
        }

        function runDoWhileLoop() {
            let output = "";
            let i = 1;
            do {
                console.log("Do...While Loop Iteration: " + i);
                output += "Iteration " + i + "<br>";
                i++;
            } while (i <= 5);
            document.getElementById("doWhileOutput").innerHTML = output;
        }

        function runForEachLoop() {
            let output = "";
            let fruits = ["Apple", "Banana", "Cherry", "Mango"];
            fruits.forEach(function(fruit, index) {
                console.log(`forEach Loop - Index: ${index}, Value: ${fruit}`);
                output += `Index ${index}: ${fruit}<br>`;
            });
            document.getElementById("forEachOutput").innerHTML = output;
        }
    </script>

</body>
</html>
