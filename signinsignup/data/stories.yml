version: "3.1"

stories:
  - story: weather query
    steps:
      - intent: ask_weather
      - action: utter_ask_location
      - slot_was_set:
          - location: null
      - action: utter_ask_date
      - slot_was_set:
          - date: null
      - action: action_get_weather

  - story: happy path
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_great
      - action: utter_happy

  - story: sad path 1
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_unhappy
      - action: utter_cheer_up
      - action: utter_happy
