
version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - ask_weather

entities:
  - location
  - date

slots:
  location:
    type: text
    mappings:
      - type: from_entity
        entity: location
  date:
    type: text
    mappings:
      - type: from_entity
        entity: date

actions:
  - action_get_weather

responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_ask_location:
  - text: "For which location?"

  utter_ask_date:
  - text: "For which date? (e.g., 2016-01-01)"

  utter_default:
  - text: "Sorry, I didn't understand. Can you rephrase?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
