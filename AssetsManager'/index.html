<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asset & Expense Manager — React + Firebase (Single File)</title>
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- XLSX for Excel -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- PapaParse for CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Firebase (Compat CDN) - LOAD BEFORE the inline Babel/React app -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Optional scrollbar polish */
    * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    *::-webkit-scrollbar { height: 8px; width: 8px; }
    *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    html.dark { color-scheme: dark; }
  </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    /***********************
     * App Constants/Utils *
     ***********************/
    const APP_ID = "asset-expense-manager"; // used in Firestore path
    const COLLECTION_PATH = (uid) => `/artifacts/${APP_ID}/users/${uid}/assets`;
    const currency = (n) => {
      const num = Number(n);
      if (!Number.isFinite(num)) return "₹0";
      return "₹" + num.toLocaleString(undefined, { maximumFractionDigits: 2 });
    };
    const normalizeRow = (row) => ({
      name: row.name ?? row.Name ?? row["Asset Name"] ?? "Untitled",
      type: row.type ?? row.Type ?? row["Asset Type"] ?? "General",
      invest: Number(row.invest ?? row.Invest ?? row["Investment Amount"] ?? 0),
      current: Number(row.current ?? row.Current ?? row["Current Value"] ?? 0),
      location: row.location ?? row.Location ?? "N/A",
      date: row.date ?? row.Date ?? row["Date of Investment"] ?? new Date().toISOString().slice(0,10),
      createdAt: Date.now()
    });

    /*********************
     * Firebase Wrapper  *
     *********************/
    const Firebase = {
      app: null, auth: null, db: null, user: null,
      init() {
        // Wait for firebase global to exist (safety for ordering)
        const waitForFirebase = (attempts = 0) => {
          if (typeof window.firebase === 'undefined') {
            if (attempts > 50) throw new Error('Firebase not loaded');
            return new Promise(res => setTimeout(() => res(waitForFirebase(attempts + 1)), 50));
          }
          return Promise.resolve();
        };

        return waitForFirebase().then(() => {
          // TODO: replace these with your actual Firebase values
          const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID",
          };
          this.app = firebase.initializeApp(firebaseConfig);
          this.auth = firebase.auth();
          this.db = firebase.firestore();
        }).catch(err => {
          console.error('Firebase init failed', err);
        });
      },
      onAuth(cb) {
        return this.auth.onAuthStateChanged(cb);
      },
      async signInAnonymously() {
        await this.auth.signInAnonymously();
      },
      colRef(uid) {
        return this.db.collection(COLLECTION_PATH(uid));
      },
      async addAsset(uid, data) {
        await this.colRef(uid).add(data);
      },
      async updateAsset(uid, id, data) {
        await this.colRef(uid).doc(id).update(data);
      },
      async deleteAsset(uid, id) {
        await this.colRef(uid).doc(id).delete();
      },
      subscribeAssets(uid, cb) {
        return this.colRef(uid).orderBy("createdAt", "desc").onSnapshot(snap => {
          const rows = [];
          snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
          cb(rows);
        }, (err) => cb([], err));
      }
    };

    /*********************
     * Voice Input hook  *
     *********************/
    function useVoiceInput(onResult) {
      const [listening, setListening] = useState(false);
      const recognizerRef = useRef(null);

      useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        const r = new SR();
        r.lang = "en-US";
        r.interimResults = false;
        r.maxAlternatives = 1;
        r.onresult = (e) => {
          const text = e.results[0][0].transcript;
          onResult?.(text);
        };
        r.onend = () => setListening(false);
        recognizerRef.current = r;
      }, []);

      const start = () => {
        if (!recognizerRef.current) { alert("Speech Recognition not supported in this browser."); return; }
        setListening(true);
        recognizerRef.current.start();
      };

      return { listening, start };
    }

    /**********************
     * Chart wrapper comp *
     **********************/
    function Charts({ data }) {
      const pieRef = useRef(null);
      const barRef = useRef(null);
      const lineRef = useRef(null);
      const chartRefs = useRef({});

      // Aggregate for charts
      const { byType, byDate } = useMemo(() => {
        const typeMap = {};
        const dateMap = {};
        data.forEach(r => {
          const t = r.type || "General";
          typeMap[t] = (typeMap[t] || 0) + Number(r.current || 0);
          const d = (r.date || "").slice(0,10);
          if (d) dateMap[d] = (dateMap[d] || 0) + Number(r.current || 0);
        });
        const byType = { labels: Object.keys(typeMap), values: Object.values(typeMap) };
        const dates = Object.keys(dateMap).sort((a,b)=> new Date(a)-new Date(b));
        const byDate = { labels: dates, values: dates.map(d => dateMap[d]) };
        return { byType, byDate };
      }, [data]);

      useEffect(() => {
        // Destroy previous
        Object.values(chartRefs.current).forEach(ch => ch?.destroy());

        // Pie
        chartRefs.current.pie = new Chart(pieRef.current, {
          type: "pie",
          data: { labels: byType.labels, datasets: [{ data: byType.values }] },
          options: { responsive: true, plugins: { legend: { position: "bottom" } } }
        });

        // Bar
        chartRefs.current.bar = new Chart(barRef.current, {
          type: "bar",
          data: { labels: byType.labels, datasets: [{ label: "Value by Type", data: byType.values }] },
          options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        // Line by date
        chartRefs.current.line = new Chart(lineRef.current, {
          type: "line",
          data: { labels: byDate.labels, datasets: [{ label: "Total Value (by date)", data: byDate.values, fill: false }] },
          options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        return () => Object.values(chartRefs.current).forEach(ch => ch?.destroy());
      }, [byType, byDate]);

      if (!data.length) return null;

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow">
            <h3 className="font-semibold mb-2">Distribution by Type</h3>
            <canvas ref={pieRef}></canvas>
          </div>
          <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow">
            <h3 className="font-semibold mb-2">Value by Type (Bar)</h3>
            <canvas ref={barRef}></canvas>
          </div>
          <div className="bg-white dark:bg-gray-900 rounded-2xl p-4 shadow lg:col-span-1">
            <h3 className="font-semibold mb-2">Total Value Over Time</h3>
            <canvas ref={lineRef}></canvas>
          </div>
        </div>
      );
    }

    /**********************
     * Table + Controls   *
     **********************/
    function Controls({ onUploadExcel, onUploadCSV, onUploadJSON, onDownloadCSV, onSample, onLLMSummary, onLLMIdea, query, setQuery, typeFilter, setTypeFilter, dark, toggleDark, onVoice }) {
      return (
        <div className="space-y-3">
          <div className="flex flex-wrap items-center gap-2 justify-between">
            <div className="flex flex-wrap gap-2">
              <label className="cursor-pointer">
                <input type="file" accept=".xlsx,.xls" className="hidden" onChange={onUploadExcel}/>
                <span className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-blue-600 text-white shadow">📥 Import Excel</span>
              </label>
              <label className="cursor-pointer">
                <input type="file" accept=".csv" className="hidden" onChange={onUploadCSV}/>
                <span className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-teal-600 text-white shadow">📥 Import CSV</span>
              </label>
              <label className="cursor-pointer">
                <input type="file" accept=".json,application/json" className="hidden" onChange={onUploadJSON}/>
                <span className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-emerald-600 text-white shadow">📥 Import JSON</span>
              </label>
              <button onClick={onSample} className="px-3 py-2 rounded-xl bg-sky-600 text-white shadow">➕ Add Sample</button>
              <button onClick={onDownloadCSV} className="px-3 py-2 rounded-xl bg-gray-800 text-white shadow">⬇️ Download CSV</button>
              <button onClick={onVoice} className="px-3 py-2 rounded-xl bg-fuchsia-600 text-white shadow">🎤 Voice Add</button>
            </div>
            <button onClick={toggleDark} className="px-3 py-2 rounded-xl border shadow bg-white dark:bg-gray-900">
              {dark ? "🌙 Dark" : "☀️ Light"}
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="Search name/type/location…" className="px-3 py-2 rounded-xl border bg-white dark:bg-gray-900"/>
            <input value={typeFilter} onChange={(e)=>setTypeFilter(e.target.value)} placeholder="Filter by type (e.g., Electronics)" className="px-3 py-2 rounded-xl border bg-white dark:bg-gray-900"/>
            <div className="flex gap-2">
              <button onClick={onLLMSummary} className="flex-1 px-3 py-2 rounded-xl bg-indigo-600 text-white shadow">🤖 Investment Summary</button>
              <button onClick={onLLMIdea} className="flex-1 px-3 py-2 rounded-xl bg-purple-600 text-white shadow">💡 New Idea</button>
            </div>
          </div>
        </div>
      );
    }

    function Table({ rows, onDelete, onEdit }) {
      if (!rows.length) {
        return (
          <div className="bg-white dark:bg-gray-900 rounded-2xl p-6 text-center text-gray-500">
            No assets yet. Import a file or add sample data.
          </div>
        );
      }
      return (
        <div className="bg-white dark:bg-gray-900 rounded-2xl overflow-x-auto shadow">
          <table className="min-w-full">
            <thead>
              <tr className="bg-gray-100 dark:bg-gray-800 text-xs uppercase tracking-wide">
                <th className="px-4 py-3 text-left">Asset Name</th>
                <th className="px-4 py-3 text-left">Asset Type</th>
                <th className="px-4 py-3 text-left">Investment Amount</th>
                <th className="px-4 py-3 text-left">Current Value</th>
                <th className="px-4 py-3 text-left">Location</th>
                <th className="px-4 py-3 text-left">Date of Investment</th>
                <th className="px-4 py-3 text-left">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
              {rows.map(r => (
                <tr key={r.id} className="hover:bg-gray-50 dark:hover:bg-gray-800">
                  <td className="px-4 py-3">{r.name}</td>
                  <td className="px-4 py-3">{r.type}</td>
                  <td className="px-4 py-3">{currency(r.invest)}</td>
                  <td className="px-4 py-3 font-medium">{currency(r.current)}</td>
                  <td className="px-4 py-3">{r.location}</td>
                  <td className="px-4 py-3">{r.date?.slice(0,10)}</td>
                  <td className="px-4 py-3">
                    <div className="flex gap-3">
                      <button onClick={()=>onEdit(r)} className="text-blue-600">Edit</button>
                      <button onClick={()=>onDelete(r)} className="text-rose-600">Delete</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )
    }

    function Modal({ open, title, children, onClose }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-2xl">
            <div className="flex items-center justify-between px-5 py-3 border-b dark:border-gray-800">
              <h3 className="font-semibold">{title}</h3>
              <button onClick={onClose} className="px-2 py-1 rounded-lg border">✕</button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Landing({ onEnter }) {
      return (
        <div className="min-h-screen grid place-items-center bg-gradient-to-br from-sky-500 via-indigo-500 to-purple-600 text-white">
          <div className="text-center space-y-6">
            <h1 className="text-4xl md:text-6xl font-extrabold drop-shadow">Asset & Expense Manager</h1>
            <p className="text-white/90 max-w-xl mx-auto">Track assets, visualize performance, and sync data in real-time with Firebase — all in a single HTML file.</p>
            <button onClick={onEnter} className="px-6 py-3 bg-white text-gray-900 rounded-2xl shadow-lg hover:scale-105 transition">Enter Dashboard</button>
          </div>
        </div>
      );
    }

    function App() {
      const [dark, setDark] = useState(() => localStorage.getItem("theme") === "dark");
      const [stage, setStage] = useState("landing"); // 'landing' | 'dashboard'
      const [user, setUser] = useState(null);
      const [rows, setRows] = useState([]); // firestore-backed assets
      const [query, setQuery] = useState("");
      const [typeFilter, setTypeFilter] = useState("");
      const [toast, setToast] = useState("");
      const [summaryOpen, setSummaryOpen] = useState(false);
      const [ideaOpen, setIdeaOpen] = useState(false);
      const [editing, setEditing] = useState(null);

      // Init Firebase + Auth
      useEffect(() => {
        Firebase.init();
        const unsub = Firebase.onAuth(async (u) => {
          if (!u) {
            await Firebase.signInAnonymously();
            return;
          }
          setUser(u);
          // Subscribe to collection
          const unsubAssets = Firebase.subscribeAssets(u.uid, (data, err) => {
            if (err) {
              console.error(err);
              setToast("Failed to load assets");
              return;
            }
            setRows(data);
          });
          return () => unsubAssets?.();
        });
        return () => unsub?.();
      }, []);

      // Dark mode
      useEffect(() => {
        document.documentElement.classList.toggle("dark", dark);
        localStorage.setItem("theme", dark ? "dark" : "light");
      }, [dark]);

      // Voice input
      const { listening, start } = useVoiceInput((text) => {
        // expected pattern: "Name: X, Type: Y, Investment: A, Current: B, Location: L, Date: YYYY-MM-DD"
        try {
          const obj = {};
          text.split(",").forEach(part => {
            const [k, ...rest] = part.split(":");
            if (!k || !rest.length) return;
            obj[k.trim().toLowerCase()] = rest.join(":").trim();
          });
          const row = normalizeRow({
            name: obj["name"],
            type: obj["type"],
            invest: obj["investment"] || obj["invest"],
            current: obj["current"],
            location: obj["location"],
            date: obj["date"]
          });
          Firebase.addAsset(user.uid, row);
          setToast("Voice asset added");
        } catch (e) {
          console.error(e);
          setToast("Could not parse voice input");
        }
      });

      // Derived
      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return rows.filter(r => {
          const okQ = !q || [r.name, r.type, r.location].some(v => (v||"").toLowerCase().includes(q));
          const okT = !typeFilter.trim() || (r.type||"").toLowerCase().includes(typeFilter.trim().toLowerCase());
          return okQ && okT;
        });
      }, [rows, query, typeFilter]);

      const totalInvest = useMemo(() => filtered.reduce((s,r)=>s+(Number(r.invest)||0), 0), [filtered]);
      const totalCurrent = useMemo(() => filtered.reduce((s,r)=>s+(Number(r.current)||0), 0), [filtered]);

      // File handlers
      const onUploadExcel = (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        const fr = new FileReader();
        fr.onload = (ev) => {
          try {
            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            json.map(normalizeRow).forEach(row => Firebase.addAsset(user.uid, row));
            setToast("Excel imported");
          } catch (err) {
            console.error(err); setToast("Excel import failed");
          }
        };
        fr.readAsArrayBuffer(file);
      };
      const onUploadCSV = (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        Papa.parse(file, {
          header: true,
          complete: (res) => {
            res.data.map(normalizeRow).forEach(row => Firebase.addAsset(user.uid, row));
            setToast("CSV imported");
          },
          error: () => setToast("CSV import failed")
        });
      };
      const onUploadJSON = (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        const fr = new FileReader();
        fr.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            (Array.isArray(data) ? data : [data]).map(normalizeRow).forEach(row => Firebase.addAsset(user.uid, row));
            setToast("JSON imported");
          } catch {
            setToast("JSON import failed");
          }
        };
        fr.readAsText(file);
      };
      const onDownloadCSV = () => {
        const rowsToSave = filtered.map(({id, createdAt, ...r}) => r);
        const csv = Papa.unparse(rowsToSave);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "assets.csv"; a.click();
        URL.revokeObjectURL(url);
      };

      // Sample data
      const onSample = () => {
        const samples = [
          { name:"Laptop", type:"Electronics", invest:80000, current:75000, location:"Mumbai", date:"2024-09-01" },
          { name:"Projector", type:"Electronics", invest:45000, current:42000, location:"Ahmedabad", date:"2024-10-12" },
          { name:"Office Chairs", type:"Furniture", invest:20000, current:18000, location:"Pune", date:"2024-05-20" },
          { name:"Printer", type:"Electronics", invest:15000, current:12000, location:"Mumbai", date:"2024-11-03" },
          { name:"Stocks - NIFTY ETF", type:"Securities", invest:50000, current:64000, location:"NSE", date:"2025-01-10" },
        ].map(normalizeRow);
        samples.forEach(r => Firebase.addAsset(user.uid, r));
        setToast("Sample data added");
      };

      // LLM summary/idea (local generator + optional hook)
      const generateSummary = () => {
        // If you want to call your LLM, put fetch() here with your API key.
        // For now, produce a helpful local summary.
        const count = filtered.length;
        const growth = totalInvest ? (((totalCurrent - totalInvest) / totalInvest) * 100) : 0;
        const byType = {};
        filtered.forEach(r => { byType[r.type] = (byType[r.type]||0) + Number(r.current||0); });
        const topType = Object.entries(byType).sort((a,b)=>b[1]-a[1])[0]?.[0] || "N/A";
        return `You hold ${count} assets. Total invested is ${currency(totalInvest)} and current value is ${currency(totalCurrent)} (${growth.toFixed(2)}% overall). Your largest category is "${topType}". Consider rebalancing if any single category exceeds 40% of total value.`;
      };
      const generateIdea = () => {
        const ideas = [
          "Explore short-duration debt funds for a safer parking of spare cash.",
          "Consider a diversified index ETF with periodic SIP to average entry cost.",
          "Augment emergency fund to 6–9 months of expenses before higher-risk bets.",
          "Evaluate a sectoral fund only if it fits your risk profile; avoid concentration.",
          "Add a depreciation schedule to tangible office assets for better tax planning."
        ];
        return ideas[Math.floor(Math.random()*ideas.length)];
      };

      // CRUD
      const onDelete = (row) => Firebase.deleteAsset(user.uid, row.id);
      const onEdit = (row) => setEditing(row);
      const saveEdit = (patch) => {
        Firebase.updateAsset(user.uid, editing.id, patch);
        setEditing(null);
      };

      if (stage === "landing") return <Landing onEnter={()=>setStage("dashboard")} />;

      return (
        <div className="min-h-screen">
          <header className="bg-white dark:bg-gray-900 border-b dark:border-gray-800">
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-blue-600 text-white grid place-items-center">A</div>
                <div>
                  <h1 className="font-semibold">Asset & Expense Manager</h1>
                  <p className="text-xs text-gray-500 dark:text-gray-400">Realtime sync via Firebase · Single-file app</p>
                </div>
              </div>
              <div className="text-sm">
                <span className="mr-3">Invested: <b>{currency(totalInvest)}</b></span>
                <span>Current: <b>{currency(totalCurrent)}</b></span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
            <Controls
              onUploadExcel={onUploadExcel}
              onUploadCSV={onUploadCSV}
              onUploadJSON={onUploadJSON}
              onDownloadCSV={onDownloadCSV}
              onSample={onSample}
              onLLMSummary={()=>setSummaryOpen(true)}
              onLLMIdea={()=>setIdeaOpen(true)}
              query={query} setQuery={setQuery}
              typeFilter={typeFilter} setTypeFilter={setTypeFilter}
              dark={dark} toggleDark={()=>setDark(d => !d)}
              onVoice={start}
            />

            <Table rows={filtered} onDelete={onDelete} onEdit={onEdit} />

            <Charts data={filtered} />
          </main>

          {/* Edit Modal */}
          <Modal open={!!editing} title="Edit Asset" onClose={()=>setEditing(null)}>
            {editing && (
              <EditForm
                initial={editing}
                onCancel={()=>setEditing(null)}
                onSave={(vals)=>saveEdit(vals)}
              />
            )}
          </Modal>

          {/* Summary Modal */}
          <Modal open={summaryOpen} title="Investment Summary (Generated)" onClose={()=>setSummaryOpen(false)}>
            <p className="text-sm leading-6">{generateSummary()}</p>
            <div className="mt-4 text-xs text-gray-500 dark:text-gray-400">
              To use your own LLM: add a fetch() call here with your API key and replace the local summary.
            </div>
          </Modal>

          {/* Idea Modal */}
          <Modal open={ideaOpen} title="New Investment Idea" onClose={()=>setIdeaOpen(false)}>
            <p className="text-sm leading-6">{generateIdea()}</p>
          </Modal>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-4 right-4 px-4 py-2 rounded-xl bg-blue-600 text-white shadow" onClick={()=>setToast("")}>
              {toast}
            </div>
          )}
        </div>
      );
    }

    function EditForm({ initial, onSave, onCancel }) {
      const [form, setForm] = useState({
        name: initial.name, type: initial.type, invest: initial.invest, current: initial.current,
        location: initial.location, date: initial.date?.slice(0,10),
      });
      const input = "w-full px-3 py-2 rounded-xl border bg-white dark:bg-gray-900";
      return (
        <form className="space-y-3" onSubmit={(e)=>{e.preventDefault(); onSave({
          name: form.name,
          type: form.type,
          invest: Number(form.invest)||0,
          current: Number(form.current)||0,
          location: form.location,
          date: form.date
        });}}>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="text-sm">Name</label><input className={input} value={form.name} onChange={e=>setForm({...form, name:e.target.value})}/></div>
            <div><label className="text-sm">Type</label><input className={input} value={form.type} onChange={e=>setForm({...form, type:e.target.value})}/></div>
            <div><label className="text-sm">Investment</label><input className={input} value={form.invest} onChange={e=>setForm({...form, invest:e.target.value})} inputMode="decimal"/></div>
            <div><label className="text-sm">Current</label><input className={input} value={form.current} onChange={e=>setForm({...form, current:e.target.value})} inputMode="decimal"/></div>
            <div><label className="text-sm">Location</label><input className={input} value={form.location} onChange={e=>setForm({...form, location:e.target.value})}/></div>
            <div><label className="text-sm">Date</label><input className={input} type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})}/></div>
          </div>
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="px-4 py-2 rounded-xl border">Cancel</button>
            <button className="px-4 py-2 rounded-xl bg-blue-600 text-white">Save</button>
          </div>
        </form>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
