<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document</title>
</head>
<body>

  <h3 id="Btn">Today date is :</h3>

  <button type="button" id="showDateBtn">Click ME</button>

  <form name="myform" onsubmit="checkname(); return false;">
    <input type="text" name="name" placeholder="Enter your fname" />
    <input type="text" name="name" placeholder="Enter your lname" />
    <button type="submit">
      Submit
    </button>
  </form>

  <script>
    const h3 = document.getElementById('Btn');
    const dateBtn = document.getElementById('showDateBtn');

    dateBtn.addEventListener('click', function () {
      h3.textContent = `Today's Date Is ${new Date().toLocaleString()}`;

      const para = document.createElement('p');
      para.setAttribute('id', 'p1');
      para.textContent = "Saiyaraa";
      document.body.appendChild(para);
    });

   
    function checkname() {
      
      const form = document.myform;
      const nameInput = form.name;
      const submitBtn = form.querySelector('button[type="submit"]');
      
      
      const heading = document.createElement('h1');
      heading.id = 'heading';

      
      heading.textContent = submitBtn.textContent;

      
      form.replaceChild(heading, nameInput);
      button.textContent =nameInput.value;
    }
  </script>
</body>
</html>
