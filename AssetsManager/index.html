<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asset & Expense Manager — React + Firebase (Single File)</title>
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- XLSX for Excel -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- PapaParse for CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Firebase (Compat CDN) - LOAD BEFORE the inline Babel/React app -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Optional scrollbar polish */
    * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    *::-webkit-scrollbar { height: 8px; width: 8px; }
    *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    html.dark { color-scheme: dark; }
  </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
const { useState } = React;

// Utility for currency formatting
const currency = (n) => {
  const num = Number(n);
  if (!Number.isFinite(num)) return "₹0";
  return "₹" + num.toLocaleString(undefined, { maximumFractionDigits: 2 });
};
function sendAssetToPHP(asset, onSuccess, onError) {
  fetch("phpfiles/add_asset.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(asset)
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        onSuccess && onSuccess();
      } else {
        onError && onError(data.error || "Unknown error");
      }
    })
    .catch(() => onError && onError("Failed to connect to PHP backend"));
}

function AssetForm({ onAdd }) {
  const [form, setForm] = useState({
    name: "",
    type: "",
    invest: "",
    current: "",
    location: "",
    date: ""
  });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const handleChange = e => {
    setForm({ ...form, [e.target.name]: e.target.value });
  };

  const handleSubmit = e => {
    e.preventDefault();
    setLoading(true);
    setError("");
    // Basic validation
    if (!form.name || !form.type || !form.invest || !form.current) {
      setError("Please fill all required fields.");
      setLoading(false);
      return;
    }
    sendAssetToPHP(form, () => {
      setLoading(false);
      setForm({ name: "", type: "", invest: "", current: "", location: "", date: "" });
      onAdd(form);
    }, (err) => {
      setLoading(false);
      setError(err);
    });
  };

  return (
    <form className="bg-white dark:bg-gray-800 p-4 rounded shadow mb-4" onSubmit={handleSubmit}>
      <div className="flex flex-wrap gap-2">
        <input className="border p-2 rounded flex-1" name="name" placeholder="Asset Name" value={form.name} onChange={handleChange} required />
        <input className="border p-2 rounded flex-1" name="type" placeholder="Type" value={form.type} onChange={handleChange} required />
        <input className="border p-2 rounded flex-1" name="invest" placeholder="Investment Amount" value={form.invest} onChange={handleChange} type="number" required />
        <input className="border p-2 rounded flex-1" name="current" placeholder="Current Value" value={form.current} onChange={handleChange} type="number" required />
        <input className="border p-2 rounded flex-1" name="location" placeholder="Location" value={form.location} onChange={handleChange} />
        <input className="border p-2 rounded flex-1" name="date" placeholder="Date" value={form.date} onChange={handleChange} type="date" />
        <button className="bg-blue-600 text-white px-4 py-2 rounded" type="submit" disabled={loading}>
          {loading ? "Saving..." : "Add Asset"}
        </button>
      </div>
      {error && <div className="text-red-600 mt-2">{error}</div>}
    </form>
  );
}

function AssetTable({ assets }) {
  if (!assets.length) return <div className="text-gray-500">No assets added yet.</div>;
  return (
    <table className="min-w-full bg-white dark:bg-gray-800 rounded shadow">
      <thead>
        <tr>
          <th className="p-2">Name</th>
          <th className="p-2">Type</th>
          <th className="p-2">Investment</th>
          <th className="p-2">Current</th>
          <th className="p-2">Location</th>
          <th className="p-2">Date</th>
        </tr>
      </thead>
      <tbody>
        {assets.map((a, i) => (
          <tr key={i} className="border-t">
            <td className="p-2">{a.name}</td>
            <td className="p-2">{a.type}</td>
            <td className="p-2">{currency(a.invest)}</td>
            <td className="p-2">{currency(a.current)}</td>
            <td className="p-2">{a.location}</td>
            <td className="p-2">{a.date}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function App() {
  const [assets, setAssets] = useState([]);
  return (
    <div className="max-w-3xl mx-auto py-8">
      <h1 className="text-2xl font-bold mb-4 text-center">Asset & Expense Manager</h1>
      <AssetForm onAdd={asset => setAssets([...assets, asset])} />
      <AssetTable assets={assets} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
